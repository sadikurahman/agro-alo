<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agro Alo – কৃষকের পাশে</title>
<style>
:root{--bg:#f1f8f3;--card:#fff;--tx:#12301d;--mut:#5d7766;--g:#15803d;--gd:#0f5a2c;--or:#f59e0b;--bd:#dcebe1;--tile:#e8f4ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--card:#16261c;--tx:#e6f3ea;--mut:#9bb5a4;--bd:#25402f;--tile:#1b3024}}
:root[data-theme="dark"]{--bg:#0e1a13;--card:#16261c;--tx:#e6f3ea;--mut:#9bb5a4;--bd:#25402f;--tile:#1b3024}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
.w{max-width:980px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:10px}
.logo{font-size:34px}header h1{margin:0;font-size:28px;color:var(--g)}header h1 span{color:#d4a017}
header small{display:block;color:var(--mut)}
.hero{margin:14px 0;border-radius:16px;padding:22px;color:#fff;background:linear-gradient(120deg,#0f5a2c,#2e9b4f);position:relative}
.hero h2{margin:4px 0 0;font-size:22px;max-width:70%}
.wx{position:absolute;right:14px;top:14px;background:#0006;border-radius:12px;padding:6px 10px;text-align:center}
.sb{display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.sb input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;min-width:0}
.sb button{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cta div{border-radius:14px;padding:14px;color:#fff;font-weight:700}.cta small{display:block;font-weight:400;opacity:.9}
.s{background:linear-gradient(120deg,#15803d,#22a04f)}.b{background:linear-gradient(120deg,#d97706,#f5a30b)}
h3{margin:18px 0 8px;font-size:18px}
.grid{display:grid;gap:10px}.cat{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.tile{background:var(--tile);border:1px solid var(--bd);border-radius:14px;padding:14px 6px;text-align:center;font-size:14px}
.tile i{display:block;font-style:normal;font-size:28px}
.pr{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.ls{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.card .e{font-size:40px}.up{color:var(--g);font-weight:700}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--tile);color:var(--g);border-radius:20px;padding:2px 10px;font-size:12px;margin-top:6px}
#none{display:none;text-align:center;padding:40px;color:var(--mut)}
mark{background:#fde68a;color:#000;border-radius:3px}
</style>
</head>
<body>
<div class="w">
<header><div class="logo">🌱</div><div><h1>Agro <span>Alo</span></h1><small>কৃষকের পাশে, সবার জন্য ভালো ফসল</small></div></header>
<div class="hero"><div>☀️ শুভ সকাল</div><h2>আবাদে হোক সমৃদ্ধি, কৃষকের ঘরে ফিরুক হাসি</h2><div class="wx">⛅ 28°C<br><small>Islampur</small></div></div>
<div class="sb"><span>🔍</span><input id="q" type="search" placeholder="ফসল, পণ্য, কৃষক, বাজার, লোকেশন খুঁজুন… / Search in English" autocomplete="off"><button id="x" hidden aria-label="clear">✕</button></div>
<div class="cta"><div class="s">🌿 ফসল বিক্রি করুন<small>আপনার কষ্টার্জিত ফসলের ন্যায্য মূল্য পান</small></div><div class="b">🛒 ফসল কিনুন<small>পাইকারবাইকার থেকে সরাসরি</small></div></div>
<div id="none">😕 কিছু পাওয়া যায়নি / No results found</div>
<section id="sc"><div class="grid cat" id="cat"></div></section>
<section id="sp"><h3>🌿 আজকের বাজারদর</h3><div class="grid pr" id="pr"></div></section>
<section id="sl"><h3>📍 কাছাকাছি বিক্রির জন্য ফসল</h3><div class="grid ls" id="ls"></div></section>
</div>
<script>
// k = অতিরিক্ত keyword (English + Banglish) যাতে যেকোনো ভাষায় সার্চ করা যায়
const CATS=[
["🌱","Seeds","বীজ","beej bij seed"],["🧪","Fertilizer","সার","shar sar fertiliser urea"],
["🧴","Pesticide","কীটনাশক","kitnashok pesticide poison spray"],["🚜","Vehicles","যানবাহন","tractor janbahan gari vehicle"],
["🛠️","Tools","যন্ত্রপাতি","jontropati tools equipment"],["🧑‍🤝‍🧑","Local Agent","লোকাল এজেন্ট","agent local"],
["📈","Market Price","বাজারদর","bazar dor price market"],["🚚","Transportation","পরিবহন","poribohon transport truck"],
["💬","Agri Help (AI)","কৃষি সহায়তা","krishi sohayota help ai"],["🏦","Loan","ঋণ","rin loan bank"],
["⛅","Weather","আবহাওয়া","abohawa weather rain"],["⋯","More","আরও","aro more"]];
const CROPS=[
["🥔","Potato","আলু","alu aloo",35,2],["🍅","Tomato","টমেটো","tomato tometo",40,3],
["🧅","Onion","পেঁয়াজ","peyaj piaj peaz",28,1],["🌶️","Green Chili","কাঁচামরিচ","kachamorich morich chili chilli",60,5]];
const LIST=[[1,"Islampur","ইসলামপুর",500],[0,"Islampur","ইসলামপুর",1000],[3,"Makkimpur","মক্কিমপুর",300]];
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
// স্পেস/যতিচিহ্ন বাদ, lowercase, বাংলা-ইংরেজি সংখ্যা এক করা
const norm=s=>s.normalize("NFC").toLowerCase().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/[\s,.\-_()\/]+/g,"");
const hay=a=>norm(a.join(" "));
const C=CATS.map(c=>({c,h:hay([c[1],c[2],c[3]])}));
const P=CROPS.map(c=>({c,h:hay([c[1],c[2],c[3],"bazar dor বাজারদর price"])}));
const L=LIST.map(l=>{const c=CROPS[l[0]];return{l,c,h:hay([c[1],c[2],c[3],l[1],l[2],"krishok কৃষক farmer"])}});
const $=id=>document.getElementById(id);
function hl(t,q){ // ম্যাচ হলে highlight
  if(!q)return t;const i=t.toLowerCase().indexOf(q.toLowerCase());
  return i<0?t:t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length)}
function render(){
  const raw=$("q").value.trim(),q=norm(raw);$("x").hidden=!raw;
  const fc=C.filter(o=>o.h.includes(q)),fp=P.filter(o=>o.h.includes(q)),fl=L.filter(o=>o.h.includes(q));
  $("cat").innerHTML=fc.map(({c})=>`<div class="tile"><i>${c[0]}</i>${hl(c[1],raw)}<div class="mut">${hl(c[2],raw)}</div></div>`).join("");
  $("pr").innerHTML=fp.map(({c})=>`<div class="card"><div class="e">${c[0]}</div><b>${hl(c[2],raw)}</b> <span class="mut">${hl(c[1],raw)}</span><div>৳ ${bn(c[4])}/kg</div><div class="up">↑ +${bn(c[5])}</div></div>`).join("");
  $("ls").innerHTML=fl.map(({l,c})=>`<div class="card"><div class="e">${c[0]}</div><b>${hl(c[2],raw)}</b> <span class="mut">${hl(c[1],raw)}</span><div class="mut">📍 ${hl(l[1],raw)} (${l[2]})</div><div class="mut">${bn(l[3])} kg available</div><b>৳ ${bn(c[4])}/kg</b><br><span class="tag">কৃষক থেকে</span></div>`).join("");
  $("sc").style.display=fc.length?"":"none";$("sp").style.display=fp.length?"":"none";$("sl").style.display=fl.length?"":"none";
  $("none").style.display=(fc.length+fp.length+fl.length)?"none":"block"}
$("q").addEventListener("input",render);
$("x").onclick=()=>{$("q").value="";render();$("q").focus()};
render();
</script>
</body>
</html>
