<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Agro Alo – কৃষক, ক্রেতা ও লোকাল এজেন্টের অনলাইন কৃষি বাজার / Agri marketplace for farmers, buyers and local agents">
<title>Agro Alo – কৃষকের পাশে, সবার জন্য ভালো ফসল</title>
<style>
:root{--bg:#f3f8f4;--card:#fff;--tx:#12301d;--mut:#4f6a59;--g:#2f8f46;--bd:#d9e8de;--tile:#e9f4ec;--er:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--card:#16261c;--tx:#e6f3ea;--mut:#a4bfae;--bd:#25402f;--tile:#1b3024;--g:#4ade80;--er:#fca5a5}}
:root[data-theme="dark"]{--bg:#0e1a13;--card:#16261c;--tx:#e6f3ea;--mut:#a4bfae;--bd:#25402f;--tile:#1b3024;--g:#4ade80;--er:#fca5a5}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5;padding-bottom:84px}
.w{max-width:1000px;margin:auto;padding:12px 14px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.lg{font-size:25px;font-weight:800;color:var(--g);line-height:1.1;margin-right:auto}.lg span{color:#d4a017}.lg small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;min-height:40px}
nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:60px;min-height:48px;border-radius:12px;color:var(--mut)}
nav button span:first-child{font-size:20px}nav button[aria-current=true]{color:var(--g);background:var(--tile);font-weight:700}
@media(min-width:720px){body{padding-bottom:84px}}
.hero{margin:12px 0;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(120deg,#1f6b33,#47ad5c);position:relative}
.hero h2{margin:2px 0 0;font-size:21px;max-width:75%}.wx{position:absolute;right:14px;top:14px;background:#0006;border-radius:12px;padding:6px 10px;text-align:center;font-size:14px}
.demo{background:#fef3c7;color:#78350f;border-radius:10px;padding:6px 12px;font-size:13px;margin:10px 0}
.sb{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 8px #0001}
.sb input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;min-width:0;min-height:44px}
.sb button{border:0;background:none;color:var(--mut);font-size:18px;min-width:40px;min-height:40px}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cta button{border:0;border-radius:14px;padding:16px;color:#fff;font-weight:700;font-size:16px;min-height:56px}
.s{background:#2f8f46}.b{background:#d98a06}
h3{margin:20px 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
h3 button{border:0;background:none;color:var(--g);font-size:14px;font-weight:700}
.grid{display:grid;gap:10px}.pr{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.ls{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.cat{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.rc{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.st{grid-template-columns:repeat(3,1fr)}
.card,.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.tile{background:var(--tile);text-align:center;font-size:13px;padding:12px 4px;min-height:84px}.tile span{display:block;font-size:28px}
.rcb{border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:18px;text-align:center;font-weight:700}.rcb span{display:block;font-size:44px}.rcb small{display:block;font-weight:400;color:var(--mut)}
.rcb:hover{border-color:var(--g)}
.e{font-size:36px}.up{color:var(--g);font-weight:700}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--tile);color:var(--g);border-radius:20px;padding:2px 10px;font-size:12px}
.call{display:inline-block;margin:8px 6px 0 0;background:var(--g);color:#fff;border-radius:10px;padding:6px 14px;text-decoration:none;font-weight:700;border:0}
.call.o{background:none;color:var(--er);border:1px solid var(--er)}
.oq{width:80px;min-height:36px;padding:4px 8px;margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 14px;min-height:44px}
.tabs button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
:root[data-theme="dark"] .tabs button[aria-pressed=true],:root[data-theme="dark"] .call,:root[data-theme="dark"] .go{color:#0e1a13}
.msg{text-align:center;padding:24px;color:var(--mut)}
mark{background:#fde68a;color:#000;border-radius:3px}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:520px;margin-top:10px}
label{display:block;margin-top:12px;font-weight:700}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-height:44px}
.er{color:var(--er);font-size:13px;min-height:18px}
.go{margin-top:16px;width:100%;border:0;background:var(--g);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:17px}
.big{font-size:22px;font-weight:800;color:var(--g)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#14532d;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
footer{text-align:center;color:var(--mut);font-size:13px;margin:30px 0 10px}
@media(max-width:520px){.cta{grid-template-columns:1fr}}

.lgi{width:44px;height:44px;border-radius:12px;object-fit:cover}
.bell{position:relative}.bell::after{content:"";position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#e11d48}
.hb{min-height:150px;background:linear-gradient(90deg,#14532d 42%,#14532d00 80%),var(--bn) right center/auto 100% no-repeat,#14532d}
.hb h2{max-width:58%}
.cta button{display:flex;align-items:center;gap:10px;text-align:left}
.cta i{font-style:normal;font-size:24px;background:#fff3;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.cta span{flex:1}.cta b{display:block}.cta small{display:block;font-weight:400;font-size:12px}.cta em{font-style:normal;font-size:20px}
.s{background:linear-gradient(120deg,#15803d,#22a04f)}.b{background:linear-gradient(120deg,#d97706,#f5a30b)}
.cat{grid-template-columns:repeat(6,1fr)}
.tile{font-size:11px;padding:10px 2px;min-height:76px}.tile span{font-size:24px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:4px 12px 12px;margin-top:16px}
.ph{width:100%;height:76px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.pc2{padding:6px}.pz{color:var(--g);font-weight:800}
.lc{display:flex;gap:10px;padding:8px;align-items:stretch}
.lp{width:42%;min-height:110px;object-fit:cover;border-radius:12px;flex:none}
.lc>.e{width:42%;display:grid;place-items:center;flex:none;background:var(--tile);border-radius:12px;min-height:90px}
.li{flex:1;min-width:0}.chip{display:inline-block;background:var(--tile);color:var(--g);border-radius:12px;padding:0 8px;font-size:12px}
.inf{display:flex;align-items:center;gap:8px;text-align:left;background:var(--tile);padding:8px}
.inf img{width:56px;height:70px;object-fit:cover;border-radius:12px;flex:none}.inf span{flex:1}.inf b{display:block}.inf small{display:block;color:var(--mut);font-size:12px}
</style>
</head>

 return `<article class="card lc">${im}<div class="li">${o.loc?`<span class="chip">📍 ${hl(o.loc,raw)}</span>`:""}<div><b>${hl(o.n[0],raw)}</b> <span class="mut">${hl(o.n[1],raw)}</span></div>${o.f?`<div class="mut">👤 ${hl(o.f,raw)}</div>`:""}${o.q?`<div class="mut">${num(o.q)} ${t("kg")}</div>`:""}<div><b>${money(o.p)}/${u(o.u)}</b></div>${o.cat==="crop"?`<span class="tag">${t(o.ag?"am":"fm")}</span>`:""}${ob}<div>${tel}${dl}</div></div></article>`}
function renderPg(){
 const US=users(),L=$("pgl"),q=norm($("pgq").value);$("pgt").textContent=t("pg_"+pg);$("pgq").hidden=pg!=="ag";
 if(pg==="mp")L.innerHTML=CROPS.map((c,i)=>`<article class="card lc">${pic(i,"lp")}<div class="li"><b>${nm(i)[0]}</b> <span class="mut">${nm(i)[1]}</span><div class="pz">${money(c[4])}/${u("kg")}</div><div class="up">↑ +${num(c[5])}</div></div></article>`).join("")+`<div class="mut">${t("pgn")}</div>`;
 else if(pg==="ag"){const A=US.filter(x=>x.r==="agent"&&norm(x.n+x.a+x.code).includes(q));L.innerHTML=A.map(a=>`<article class="card"><div class="e" aria-hidden="true">🧑‍💼</div><b>${esc(a.n)}</b> <span class="tag">${a.code}</span><div class="mut">📍 ${esc(a.a)}</div><div class="mut">${t("st1")}: ${num(US.filter(x=>x.ag===a.code).length)}</div><a class="call" href="tel:${a.h}">${t("call")}</a></article>`).join("")||`<div class="msg">${t("none")}</div>`}
 else L.innerHTML=PROD.filter(p=>p[0]==="veh").map(p=>`<article class="card"><div class="e" aria-hidden="true">${p[1]}</div><b>${esc(lang==="bn"?p[3]:p[2])}</b><div><b>${money(p[5])}/${u(p[6])}</b></div></article>`).join("")+`<div class="mut">${t("pgn")}</div>`}
function renderAuth(){
 $("ar").hidden=!!authRole;$("aw").hidden=!authRole;
 $("ar").innerHTML=["farmer","buyer","agent"].map(r=>`<button class="rcb" data-role="${r}"><span aria-hidden="true">${RE[r]}</span>${t("r_"+r)}<small>${t("rd_"+r)}</small></button>`).join("");
 if(!authRole)return;
 const f=authRole==="farmer";if(f)mode="login";
 $("at").textContent=RE[authRole]+" "+t("r_"+authRole)+" – "+t(mode);
 $("an").hidden=$("aa").hidden=mode==="login";
 $("as").textContent=t(mode);$("am").hidden=f;$("am").textContent=t(mode==="login"?"toS":"toL");
 $("dh").textContent=(f?t("fo")+". ":"")+t("dn")+DEMO[authRole]}
function render(){
 const M=me()||{r:"guest",n:"",a:"Islampur",id:"",h:""};ITEMS=items();const raw=$("q").value.trim(),q=norm(raw);$("x").hidden=!raw;
 renderAuth();$("nav").hidden=false;
 const r=M.r;if(view==="pg")renderPg();
 $("nav").innerHTML=[["home","🏠",t("home")],["mk","🛒",t("mk")],["my","🌾",t("my_"+(r==="guest"?"farmer":r))],["chat","💬",t("chat")],["more","⋯",t("more")]].map(n=>`<button ${n[0]==="chat"?'data-soon="1"':`data-go="${n[0]}"`} aria-current="${n[0]===view}"><span aria-hidden="true">${n[1]}</span><span>${n[2]}</span></button>`).join("");
 $("hn").textContent=M.n?", "+M.n:"";$("wl").textContent=M.a;
 $("cta").innerHTML=`<button class="s" data-go="my"><i aria-hidden="true">🌱</i><span><b>${t("cs").replace(/^\S+\s/,"")}</b><small>${t("css")}</small></span><em>→</em></button><button class="b" data-tab="crop"><i aria-hidden="true">🛒</i><span><b>${t("cb").replace(/^\S+\s/,"")}</b><small>${t("cbs")}</small></span><em>→</em></button>`;
 $("cat").innerHTML=[["🌱","seeds","tab"],["🧪","fert","tab"],["🧴","pest","tab"],["🚜","veh","tab"],["🛠️","tool","tab"],["🧑‍🤝‍🧑","agent","pg"],["📈","mp","pg"],["🚚","tr","pg"],["💬","ai","soon"],["🏦","loan","soon"],["⛅","wx","soon"],["⋯","more","go"]].map(c=>`<button class="tile" ${c[2]==="tab"?`data-tab="${c[1]}"`:c[2]==="pg"?`data-pg="${c[1]==="agent"?"ag":c[1]}"`:c[2]==="go"?'data-go="more"':'data-soon="1"'}><span aria-hidden="true">${c[0]}</span>${t("c_"+c[1])}</button>`).join("");
 $("pr").innerHTML=CROPS.slice(0,4).map((c,i)=>`<div class="card pc2">${pic(i,"ph")}<b>${nm(i)[0]}</b><div class="pz">${money(c[4])}/${u("kg")}</div><div class="up">↑ +${num(c[5])}</div></div>`).join("");
 $("hl").innerHTML=ITEMS.filter(o=>o.cat==="crop").slice(0,3).map(o=>card(o,"",false,M)).join("");
 $("inf").innerHTML=["i1","i2","i3"].map((k,j)=>`<button class="card inf" ${j===1?'data-pg="ag"':'data-soon="1"'}><img alt="" src="${IMG.i[j]}"><span><b>${t(k)}</b><small>${t(k+"s")}</small></span><em>→</em></button>`).join("");
 $("tabs").innerHTML=CATS.map(c=>`<button data-tab="${c[0]}" aria-pressed="${c[0]===tab&&!raw}">${c[1]} ${t("c_"+c[0])}</button>`).join("");
 const list=raw?ITEMS.filter(o=>norm(o.k+" "+o.n.join(" ")).includes(q)):ITEMS.filter(o=>o.cat===tab);
 $("ml").innerHTML=list.map(o=>card(o,raw,false,M)).join("");$("none").hidden=!!list.length;$("none").textContent="😕 "+t("none");
 // আমার পেজ (ভূমিকা অনুযায়ী)
 const A=r==="agent",F=r==="farmer",myF=users().filter(x=>x.r==="farmer"&&x.ag===M.code);
 const mo=orders.filter(o=>A?o.ag===M.code:F?o.f===M.id:o.b===M.id);
 $("stw").hidden=!A;$("sw").hidden=r==="buyer";$("sfw").hidden=!A;
 if(A){const ac=mo.filter(o=>o.st==="a");$("cd").textContent=M.code;$("s1").textContent=num(myF.length);$("s2").textContent=money(ac.reduce((s,o)=>s+o.p*o.q,0));$("s3").textContent=money(ac.reduce((s,o)=>s+o.com,0));
  $("fl").innerHTML=myF.map(x=>`<article class="card"><b>🧑‍🌾 ${esc(x.n)}</b><div class="mut">📍 ${esc(x.a)}</div><a class="call" href="tel:${x.h}">${t("call")}</a></article>`).join("");
  const sv=$("sf").value;$("sf").innerHTML=myF.map(x=>`<option value="${x.id}">${esc(x.n)} (${esc(x.a)})</option>`).join("");$("sf").value=sv||(myF[0]&&myF[0].id)||""}
 $("my").innerHTML=ITEMS.filter(o=>o.cat==="crop"&&(A?o.ag===M.code:o.fid===M.id)).map(o=>card(o,"",true,M)).join("");
 $("ot").textContent=t(r==="buyer"?"ot_b":"ot_s");
 const us=users();
 $("ol").innerHTML=mo.length?mo.map(o=>{const i=orders.indexOf(o),n=nm(o.c),b=us.find(x=>x.id===o.b)||{};return `<article class="card"><div class="e" aria-hidden="true">${CROPS[o.c][0]}</div><b>${n[0]}</b> <span class="mut">${num(o.q)} ${u("kg")}</span><div class="mut">📍 ${esc(o.l)} · 👤 ${esc(b.n||"")}</div><div><b>${money(o.p*o.q)}</b></div><span class="tag">${t(o.st==="a"?"acc":"pend")}</span>${A&&o.st==="a"?` <span class="tag">${t("com")} ${money(o.com)}</span>`:""}${r!=="buyer"&&o.st==="p"?`<div><button class="call" data-acc="${i}">${t("accb")}</button></div>`:""}</article>`}).join(""):`<div class="msg">${t("noord")}</div>`;
 const ag=M.ag?us.find(x=>x.code===M.ag):null;
 $("pc").innerHTML=`<div class="e" aria-hidden="true">${RE[r]}</div><h3>${esc(M.n)}</h3><div>${t("r_"+r)}</div><div class="mut">📞 ${esc(M.h)}</div><div class="mut">📍 ${esc(M.a)}</div>${M.code?`<div class="mut">${t("code")}<b>${M.code}</b></div>`:""}${ag?`<div class="mut">${t("ag")}: ${esc(ag.n)} (${ag.code})</div>`:""}`}
function i18n(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $("lang").textContent=lang==="bn"?"EN":"বাং";
 const v=$("fc").value;$("fc").innerHTML=CROPS.map((c,i)=>`<option value="${i}">${c[0]} ${esc(nm(i)[0])}</option>`).join("");$("fc").value=v||"0";
 render()}
function show(v){
 if(!me()){sid=null;if(!["home","mk","pg"].includes(v)){if(v!=="auth")after=v;v="auth"}}view=v;
 ({auth:"vAuth",home:"vHome",mk:"vMk",my:"vMy",more:"vMore"},Object.entries({auth:"vAuth",home:"vHome",mk:"vMk",pg:"vPg",my:"vMy",more:"vMore"}).forEach(([k,id])=>$(id).hidden=k!==v));
 $("sbw").hidden=!(v==="home"||v==="mk");window.scrollTo(0,0);render()}
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function err(p,ids){ids.forEach(([id,ok,k])=>$(id).textContent=ok?"":t(k));return ids.every(x=>x[1])}
$("q").addEventListener("input",()=>{if($("q").value.trim()&&view!=="mk")show("mk");else render()});
$("x").onclick=()=>{$("q").value="";render();$("q").focus()};
$("lang").onclick=()=>{lang=lang==="bn"?"en":"bn";save("lang",lang);i18n()};
$("ab").onclick=()=>{authRole=null;render()};
$("am").onclick=()=>{mode=mode==="login"?"signup":"login";renderAuth()};
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b;
 if(b=g("[data-role]")){authRole=b.dataset.role;mode="login";render()}
 else if(b=g("[data-go]"))show(b.dataset.go)
 else if(b=g("[data-tab]")){$("q").value="";tab=b.dataset.tab;show("mk")}
 else if(b=g("[data-pg]")){pg=b.dataset.pg;$("pgq").value="";show("pg")}
 else if(g("[data-soon]"))toast(t("soon"))
 else if(g("[data-out]")){sid=null;authRole=null;save("sid","");show("home")}
 else if(b=g("[data-ord]")){if(!me()){after="mk";authRole="buyer";mode="signup";show("auth");return}const M=me(),o=ITEMS[+b.dataset.ord],qty=Math.round(+b.parentNode.querySelector(".oq").value);
  if(!(qty>=1&&qty<=o.q))return toast(t("eqn"));
  orders.unshift({c:o.ci,p:o.p,q:qty,l:o.loc,st:"p",f:o.fid,ag:o.ag||"",b:M.id,com:0});save("orders",orders);toast(t("sent"))}
 else if(b=g("[data-acc]")){const o=orders[+b.dataset.acc];o.st="a";o.com=o.ag?o.p*o.q*AGC:0;o.cc=o.p*o.q*COC;save("orders",orders);render()}
 else if(b=g("[data-del]")){mine=mine.filter(m=>String(m.id)!==b.dataset.del);save("mine",mine);render()}});
$("af").addEventListener("submit",e=>{e.preventDefault();
 const h=ph($("ah").value),n=$("an1").value.trim(),a=$("aa1").value.trim(),su=mode==="signup";$("e4").textContent="";
 if(!err(0,[["e1",!su||n.length>1,"rq"],["e2",!su||a.length>1,"rq"],["e3",okp(h),"bp"]]))return;
 const ex=users().find(x=>x.h===h);
 if(!su){const u0=users().find(x=>x.h===h&&x.r===authRole);if(!u0)return $("e4").textContent=t("nf");sid=u0.id}
 else{if(ex)return $("e4").textContent=t("dup");
  const nu={id:"x"+Date.now(),r:authRole,n,h,a};if(authRole==="agent")nu.code="AG-"+(1002+ux.filter(x=>x.r==="agent").length);
  ux.push(nu);save("ux",ux);sid=nu.id}
 save("sid",sid);e.target.reset();authRole=null;const d=after;after="home";show(d)});
$("of").addEventListener("submit",e=>{e.preventDefault();const M=me(),n=$("on").value.trim(),a=$("ov").value.trim(),h=ph($("oh").value);
 if(!err(0,[["o1",n.length>1,"rq"],["o2",a.length>1,"rq"],["o3",okp(h)&&!users().find(x=>x.h===h),okp(h)?"dup":"bp"]]))return;
 ux.push({id:"x"+Date.now(),r:"farmer",n,h,a,ag:M.code});save("ux",ux);e.target.reset();toast(t("opened"));render()});
$("f").addEventListener("submit",e=>{e.preventDefault();const M=me(),A=M.r==="agent",fid=A?$("sf").value:M.id,q=+$("fq").value,p=+$("fp").value;
 if(!err(0,[["ef",!!fid,"rq"],["eq",q>0,"rq"],["ep",p>0,"rq"]]))return;
 mine.unshift({id:Date.now(),c:+$("fc").value,q:Math.round(q),p,f:fid});save("mine",mine);
 $("fq").value=$("fp").value="";toast(t("ok"));render()});
$("pgq").addEventListener("input",render);
document.documentElement.style.setProperty("--bn","url("+IMG.banner+")");$("lgi").src=IMG.logo;
i18n();show("home");
</script>
