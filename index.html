<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Alo - কৃষকের পাশে</title>
<!-- Google Fonts থেকে Hind Siliguri ফন্ট যুক্ত করা হলো চমৎকার বাংলা লেখার জন্য -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Hind Siliguri', Arial, sans-serif;
  background: #f1f8f3;
  color: #1a3322;
  padding-bottom: 80px;
}

/* HEADER */
header {
  background: white;
  padding: 15px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon img {
  width: 42px;
  height: 42px;
}

.logo-text h1 {
  font-size: 24px;
  color: #067236;
  font-weight: 700;
  line-height: 1.2;
}

.logo-text p {
  font-size: 11px;
  color: #5d7264;
}

.header-icons {
  display: flex;
  gap: 14px;
  align-items: center;
}

.header-icon {
  background: #f1f8f3;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}

/* HERO BANNER */
.hero {
  margin: 12px;
  height: 140px;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: 
    linear-gradient(90deg, rgba(16, 76, 36, 0.9) 0%, rgba(26, 114, 56, 0.4) 100%),
    url('https://unsplash.com') center/cover;
  color: white;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero p {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0.9;
}

.hero h2 {
  font-size: 18px;
  font-weight: 600;
  margin-top: 6px;
  line-height: 1.4;
  max-width: 220px;
}

.weather {
  position: absolute;
  right: 16px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(4px);
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 12px;
  text-align: right;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.weather strong {
  font-size: 14px;
  display: block;
}

/* SEARCH BAR */
.search-container {
  margin: 12px;
  background: white;
  border: 1px solid #dbe7df;
  border-radius: 14px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

.search-container .search-icon {
  font-size: 18px;
  color: #728a7c;
}

.search-container input {
  width: 100%;
  border: 0;
  outline: none;
  padding: 12px 10px;
  font-size: 14px;
  color: #1a3322;
  font-family: inherit;
}

.search-container .filter-icon {
  font-size: 18px;
  color: #067236;
  cursor: pointer;
}

/* MAIN ACTIONS (SELL/BUY) */
.main-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 12px;
}

.main-btn {
  border: 0;
  border-radius: 16px;
  padding: 16px 14px;
  color: white;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.sell-btn {
  background: #067236;
}

.buy-btn {
  background: #ffb000;
}

.btn-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.btn-icon-wrapper {
  background: rgba(255, 255, 255, 0.2);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.btn-arrow {
  font-size: 16px;
}

.main-btn strong {
  font-size: 16px;
  margin-top: 10px;
  font-weight: 700;
}

.main-btn small {
  font-size: 10px;
  opacity: 0.9;
  margin-top: 2px;
  font-weight: normal;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

/* GRID CATEGORIES */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin: 16px 12px;
}

.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
}

.category-icon {
  background: #e3f2e8;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 4px;
  transition: transform 0.2s;
}

.category-item p {
  font-size: 11px;
  color: #4a5e50;
  font-weight: 500;
}

/* SECTION STRUCTURE */
.section-wrapper {
  margin: 20px 12px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.section-header h2 {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-header .see-all {
  color: #067236;
  font-size: 12px;
  text-decoration: none;
  font-weight: 600;
}

/* HORIZONTAL SCROLL LISTS */
.scroll-container {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none; /* Firefox */
}

.scroll-container::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

/* MARKET CARD */
.market-card {
  min-width: 135px;
  max-width: 135px;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e3ede6;
  padding: 8px;
}

.market-card img {
  width: 100%;
  height: 75px;
  object-fit: cover;
  border-radius: 10px;
}

.market-info {
  margin-top: 6px;
}

.market-info h3 {
  font-size: 13px;
  font-weight: 600;
  color: #1a3322;
}

.market-info .price {
  font-size: 12px;
  color: #555;
  margin-top: 2px;
}

.market-info .trend {
  font-size: 11px;
  font-weight: 600;
  margin-top: 2px;
}

.trend.up { color: #2e7d32; }
.trend.down { color: #c62828; }

/* PRODUCT CARD */
.product-card {
  min-width: 180px;
  max-width: 180px;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e3ede6;
  padding: 8px;
}

.product-card img {
  width: 100%;
  height: 95px;
  object-fit: cover;
  border-radius: 10px;
}

.product-details {
  margin-top: 6px;
}

.meta-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #ff6f00;
  font-weight: 600;
}

.product-details h3 {
  font-size: 13px;
  font-weight: 600;
  color: #1a3322;
  margin-top: 2px;
}

.product-details .qty {
  font-size: 10px;
  color: #728a7c;
}

.product-details .price {
  font-size: 13px;
  font-weight: 700;
  color: #1a3322;
  margin-top: 2px;
}

.tag-farmer {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #eaf6ee;
  color: #067236;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 6px;
  margin-top: 4px;
  font-weight: 600;
}

/* INFO ROW (HELPERS) */
.info-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 16px 12px;
}

.info-card {
  background: #eaf6ee;
  border-radius: 14px;
  padding: 12px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.info-card .avatar {
  font-size: 24px;
}

.info-text h4 {
  font-size: 11px;
  font-weight: 700;
  color: #1a3322;
}

.info-text p {
  font-size: 9px;
  color: #5d7264;
  line-height: 1.2;
  margin-top: 1px;
}

/* NO RESULT MESSAGE */
#noResult {
  display: none;
  text-align: center;
  padding: 30px 15px;
  color: #555;
}

/* BOTTOM NAVIGATION BAR */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #e2ece5;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #728a7c;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
}

.nav-item .icon {
  font-size: 20px;
  margin-bottom: 2px;
}

.nav-item.active {
  color: #067236;
  font-weight: 700;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <!-- স্ক্রিনশটের মতো লোগো আইকন সেট করা হলো -->
      <span style="font-size:32px;">🌱</span>
    </div>
    <div class="logo-text">
      <h1>Agro Alo</h1>
      <p>কৃষকের পাশে, সবার জন্য ভালো ফসল</p>
    </div>
  </div>
  <div class="header-icons">
    <div class="header-icon">🔔</div>
    <div class="header-icon">👤</div>
  </div>
</header>

<!-- HERO BANNER -->
<section class="hero">
  <p>☀️ শুভ সকাল</p>
  <h2>আবাদে হোক সমৃদ্ধি,<br>কৃষকের ঘরে ফিরুক হাসি</h2>
  <div class="weather">
    🌤️ <strong>28°C</strong>
    <small>Islampur</small>
  </div>
</section>

<!-- SEARCH BAR -->
<div class="search-container">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="ফসল, পণ্য, কৃষক, বাজার, এমনকি লোকেশন খুঁজুন...">
  <span class="filter-icon">Tune</span>
</div>

<!-- ACTIONS -->
<div class="main-buttons">
  <div class="main-btn sell-btn" onclick="alert('বিক্রি প্যানেল শীঘ্রই চালু হচ্ছে!')">
    <div class="btn-header">
      <div class="btn-icon-wrapper">🌱</div>
      <span class="btn-arrow">→</span>
    </div>
    <strong>ফসল বিক্রি করুন</strong>
    <small>আপনার কষ্টার্জিত ফসলের ন্যায্য মূল্য পান</small>
  </div>

  <div class="main-btn buy-btn" onclick="document.getElementById('products-section').scrollIntoView({behavior: 'smooth'})">
    <div class="btn-header">
      <div class="btn-icon-wrapper">🛒</div>
      <span class="btn-arrow">→</span>
    </div>
    <strong>ফসল কিনুন</strong>
    <small>পাইকার/বাইকার থেকে সরাসরি</small>
  </div>
</div>

<!-- 12 CATEGORIES GRID (As seen in screenshot) -->
<section class="categories-grid">
  <div class="category-item"><div class="category-icon">🌱</div><p>Seeds</p></div>
  <div class="category-item"><div class="category-icon">💊</div><p>Fertilizer</p></div>
  <div class="category-item"><div class="category-icon">🧪</div><p>Pesticide</p></div>
  <div class="category-item"><div class="category-icon">🚜</div><p>Vehicles</p></div>
  <div class="category-item"><div class="category-icon">🛠️</div><p>Tools</p></div>
